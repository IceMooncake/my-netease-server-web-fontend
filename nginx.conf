server {
    listen 80;
    server_name _;
    
    # 修正：使用 $host 确保重定向到正确的 IP 或域名
    return 301 https://$host$request_uri;
}

server {
    # 修正：http2 建议这样写 (取决于 Nginx 版本，如果报错则改回 listen 443 ssl http2)
    listen 443 ssl;
    http2 on; 
    
    server_name _; # 建议改为你的公网 IP

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 保持不变...
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 请求
    location /api/ {
        proxy_pass http://host.docker.internal:3000; # 确认后端服务端口无误
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.io 支持
    location /socket.io/ {
        proxy_pass http://host.docker.internal:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    error_page 404 /index.html;
}